name: Build + publish Docker image

# Build the rawclaw v3 image on GitHub Actions runners (free 7GB RAM)
# and push to GHCR. Production VPS only `docker pull`s — no rebuild on
# the box. Was: VPS ran `docker compose up --build` which OOM-killed
# the 4GB CX22 every deploy and hung the host.

on:
  push:
    branches: [v3]
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "patches/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "Dockerfile.v3"
      - "docker/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name follows the repo path. Lowercase per GHCR requirement.
  IMAGE_NAME: rawgrowth-consulting/rawclaw

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to ghcr.io/<owner>/<repo> without an
      # extra PAT. Default scope is read; we need write here.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v3
            type=sha,format=short,prefix=v3-

      - uses: docker/build-push-action@v6
        with:
          context: .
          # BUG-43 follow-up (D 2026-05-18): explicitly point at
          # Dockerfile.v3. Default was unset = buildx falls back to
          # `Dockerfile` (the self-hosted variant), so PR #179 + #181
          # changes against Dockerfile.v3 produced images that did
          # not actually contain those layers. The v3 compose stack
          # builds from Dockerfile.v3 locally, so the GHCR image
          # needs the same source to match.
          file: Dockerfile.v3
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # standalone Next output is ~150MB, full image ~600MB.
          # Compress to save GHCR bandwidth on every VPS pull.
          provenance: false

  # ---------------------------------------------------------------------
  # Auto-deploy hook (R-MARTI-CANONICAL unblock).
  #
  # WHAT: After `build` pushes a fresh `:v3` tag to GHCR, SSH into the
  # Marti VPS and run `docker compose pull app && docker compose up -d app`
  # in /opt/rawclaw. The compose file already pins `image:` to
  # `ghcr.io/rawgrowth-consulting/rawclaw:v3`, so `pull` resolves the new
  # digest and `up -d` recreates only the `app` service.
  #
  # WHY: Pre-hook flow was manual: every v3 merge required Pedro to SSH
  # in and run pull + up. This blocks the canonical regression loop
  # (R-MARTI-CANONICAL) because the box stays on the old image until a
  # human is awake. With this hook the box is image-fresh within ~30s of
  # GHCR push, and the canonical retry daemon can validate against the
  # actual shipped artifact.
  #
  # SAFETY:
  # - `needs: build` ensures we never deploy a failed build.
  # - Only `app` service is touched. Drain server / Caddy / supabase
  #   adjuncts stay running (no full `docker compose up -d`).
  # - No rebuild on the VPS - just pull + recreate. CX22 4GB RAM stays
  #   safe (the OOM-during-build incident is what justified moving the
  #   build to GH runners in the first place).
  # - Secrets required (Pedro must set via `gh secret set`):
  #     MARTI_SSH_HOST  - e.g. 49.13.116.154
  #     MARTI_SSH_USER  - root
  #     MARTI_SSH_KEY   - private key with access to that host
  #   If any secret is unset the step fails fast, the build still ships
  #   to GHCR, and the deploy is the only red signal (build stays green).
  # ---------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Skip on workflow_dispatch reruns from random branches: only auto
    # deploy when the build came from a real push to v3.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v3'
    env:
      # Surfaced at job env so the step-level `if` below can read it.
      # Job-level `if:` cannot see `env.X` (GH parser only resolves
      # workflow-level env at that stage), which is what PR #119
      # silently tripped on -- the workflow rejected with a 0s
      # "workflow file issue" and every v3 push went red.
      MARTI_SSH_KEY: ${{ secrets.MARTI_SSH_KEY }}
    steps:
      - name: SSH pull + restart app on Marti VPS
        # Skip silently when the SSH secret is unset. Per Pedro policy
        # the secret may stay unset; A pulls the VPS manually. This
        # kills the red-noise on every v3 push without rejecting the
        # workflow file.
        if: env.MARTI_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MARTI_SSH_HOST }}
          username: ${{ secrets.MARTI_SSH_USER }}
          key: ${{ secrets.MARTI_SSH_KEY }}
          # `set -e` so any failure (auth, pull, up) bubbles up red.
          # `--quiet` on pull keeps the action log readable.
          script: |
            set -euo pipefail
            cd /opt/rawclaw
            docker compose pull app
            docker compose up -d app
            docker image prune -f

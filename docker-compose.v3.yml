# ──────────────────────────────────────────────────────────
# Rawgrowth AIOS v3 — per-client VPS app, shared Supabase cloud.
#
#   app    — Next.js standalone server, talks to Supabase directly
#   caddy  — TLS + reverse proxy
#
# Contrast with docker-compose.yml (self_hosted): no local postgres,
# no postgrest. Multi-tenant isolation comes from Supabase RLS keyed
# to the organization_id claim in the NextAuth JWT (see migration
# 0016_v3_rls_by_org.sql).
#
# All secrets come from a .env file sitting next to this compose file.
# See .env.v3.example for the full list.
# ──────────────────────────────────────────────────────────

services:
  app:
    # GHCR image is the deploy target: `docker compose pull app` fetches
    # this tag (CI publishes it on every v3 push). Without an `image:`
    # line a build-only service is SKIPPED by `pull`, so deploy-vps.sh
    # silently kept the stale local image. `up -d` (no --build) uses this
    # pulled image, so the 4GB box never rebuilds (the OOM trap).
    image: ghcr.io/rawgrowth-consulting/rawclaw:v3
    build:
      context: .
      dockerfile: Dockerfile.v3
    restart: unless-stopped
    # Reach the host's rawclaw-drain server at http://host.docker.internal:9876
    # — systemd service spawns Claude Code on inbound webhook events.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEPLOY_MODE: v3
      RAWCLAW_DRAIN_URL: http://host.docker.internal:9876

      # Shared Supabase project. Service-role key bypasses RLS (used by
      # server code); anon key is exposed to the browser bundle.
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # Used for app-level secret-at-rest encryption (lib/crypto.ts).
      JWT_SECRET: ${JWT_SECRET}

      # Composio v3 toolkit (Gmail / Slack / Calendar / etc). BUG-20
      # root cause (D 01:15 verified on Marti): /opt/rawclaw/.env had
      # COMPOSIO_API_KEY set but the compose `app` service env block
      # didn't thread it through, so the container's
      # `resolveComposioApiKey(orgId)` env fallback failed and every
      # composio_use_tool call reported "no connected account" /
      # mis-routed. Default `:-` so a deploy without Composio still
      # boots clean. Webhook secret is for inbound Composio callbacks.
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_WEBHOOK_SECRET: ${COMPOSIO_WEBHOOK_SECRET:-}

      # Bearer required by /api/cron/* endpoints (schedule-tick, claude-token).
      CRON_SECRET: ${CRON_SECRET:-}

      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@rawgrowth.ai}

      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      NANGO_PUBLIC_KEY: ${NANGO_PUBLIC_KEY:-}
      NANGO_WEBHOOK_SECRET: ${NANGO_WEBHOOK_SECRET:-}

      # Anthropic API (Commercial Terms) for Path B fallback. Optional at
      # boot — required the first time the runtime selector flips to SDK.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # OpenAI is used by the ported onboarding chat (gpt-4o agentic loop)
      # and embedding endpoints (text-embedding-3-large).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Per-call-site LLM provider overrides. Without these the route
      # handlers see process.env.*_LLM_PROVIDER=undefined and silently
      # fall through to provider auto-detection (claude-max OAuth when
      # the org has it connected). That breaks the per-VPS plan: AGENTS.md
      # locks onboarding chat on OpenAI gpt-4o for trial. provision-vps.sh
      # writes both vars into /opt/rawgrowth/.env; this block is what
      # actually surfaces them inside the container.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ONBOARDING_LLM_PROVIDER: ${ONBOARDING_LLM_PROVIDER:-}
      EXECUTOR_LLM_PROVIDER: ${EXECUTOR_LLM_PROVIDER:-}
      BRAND_VOICE_LLM_PROVIDER: ${BRAND_VOICE_LLM_PROVIDER:-}

      # fastembed (default RAG provider) caches the ~33MB ONNX model in
      # this directory. Volume-mounted so docker rebuilds + container
      # recreations don't re-download from HuggingFace + re-pay the
      # ~10s cold-start.
      FASTEMBED_CACHE_DIR: /var/lib/rawclaw/fastembed

      # First-boot seed of this VPS's organization. Runs once; no-op on reboots.
      SEED_ORG_NAME: ${SEED_ORG_NAME}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      # v2 suffix forces a fresh named volume so it inherits the
      # nextjs:nodejs ownership the runner stage now sets on
      # /var/lib/rawclaw/fastembed. The original `fastembed-cache`
      # volume was created when the image briefly ran as root and
      # stayed root-owned, blocking the model download once the
      # container correctly drops to uid 1001.
      - fastembed-cache-v2:/var/lib/rawclaw/fastembed

      # Claude CLI OAuth credentials. 2026-05-19 incident: every
      # `docker compose up --force-recreate app` wipes the container's
      # /home/nextjs/.claude/ dir, so the OAuth token vanished and the
      # CLI fell back to "Invalid API key" until re-login. Bind-mount the
      # host's rawclaw-owned credentials file (kept fresh by the drain
      # server's tick-sync, see scripts/provision-vps.sh CREDS_PATH) so
      # the token survives recreates. claude-max-oauth orgs MUST leave
      # ANTHROPIC_API_KEY empty (see .env.v3.example) - a stale key in
      # that slot overrides this OAuth token and re-breaks auth.
      - /home/rawclaw/.claude/.credentials.json:/home/nextjs/.claude/.credentials.json

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    volumes:
      - ./docker/Caddyfile.v3:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
  fastembed-cache-v2:
